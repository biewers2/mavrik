# Root cargo file to classify the root directory as a Rust workspace and manage the dependencies of the sub-crates.
#
# All sub crates should exist in the `ext/` ("extension") directory.

[workspace]
resolver = "3"
members = ["ext/mavrik-exe", "ext/mavrik-ext", "ext/mavrik-lib", "ext/ruby-bridge"]

[workspace.dependencies]
anyhow = "1.0"
env_logger = { version = "0.11", features = ["unstable-kv"] }
futures = { version = "0.3", features = ["default"] }
libc = "0.2"
rb-sys = "0.9"
log = { version = "0.4", features = ["kv", "kv_std"] }
magnus = "0.8"
rutie = "0.13" # Need to extract GVL (un)locking and put it here.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_magnus = "0.11"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
tokio = { version = "1.40", features = ["rt", "io-util", "macros", "sync"] }

[workspace.package]
edition = "2024"
authors = ["Jacob Biewer <biewers2@gmail.com>"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
